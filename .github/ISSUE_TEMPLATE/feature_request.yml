name: Feature Request
description: Propose a new capability or UX improvement for Context Notes Native.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Workflow Need
      description: What problem does this solve in your Codex Desktop Chat workflow?
      placeholder: I'm trying to...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered (Optional)
      description: Any workarounds or alternative designs you considered.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project Boundary Alignment
      description: Context Notes Native strictly avoids process injection, credential/cookie extraction, and hidden telemetry.
      options:
        - label: I understand this project integrates strictly via Windows UIA and official `codex.exe app-server` APIs.
          required: true
